<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="ライオン兄さんセミナー｜ファーストビュー3案">
  <meta property="og:description" content="紺・炎・ゴールドの3案を並べた確認ページです。">
  <title>ライオン兄さんセミナー｜ファーストビュー3案</title>
  <style>
    :root {
      color-scheme: dark;
      background: #0b1425;
      color: #f8f3e8;
      font-family: system-ui, "Yu Gothic UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1280px, 100%); margin: auto; padding: clamp(16px, 4vw, 44px); }
    header { padding-block: 8px 20px; border-bottom: 1px solid #685333; }
    h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 2rem); line-height: 1.45; }
    header p { margin: 8px 0 0; color: #d7cdbb; line-height: 1.6; }
    .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
    figure { margin: 0; border: 1px solid #685333; border-radius: 8px; background: #101d30; overflow: hidden; }
    figcaption { padding: 12px 14px; color: #f1d094; font-weight: 700; }
    a { display: block; }
    a:focus-visible { outline: 3px solid #f1d094; outline-offset: -3px; }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 760px) { .gallery { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ライオン兄さんセミナー｜ファーストビュー3案</h1>
      <p>画像を選ぶと、元のサイズで開けます。</p>
    </header>
    <section class="gallery" aria-label="ファーストビューの確認">
      <figure id="navy">
        <figcaption>01　紺ベース</figcaption>
        <a href="01-navy.gif" target="_blank" rel="noopener">
          <img src="01-navy.gif" width="1040" height="1450" alt="紺ベースのファーストビューを拡大する">
        </a>
      </figure>
      <figure id="fire">
        <figcaption>02　炎</figcaption>
        <a href="02-fire.gif" target="_blank" rel="noopener">
          <img src="02-fire.gif" width="1040" height="1450" alt="炎のファーストビューを拡大する">
        </a>
      </figure>
      <figure id="gold">
        <figcaption>03　ゴールド・炎あり</figcaption>
        <a href="03-gold-flame-soft-background.gif" target="_blank" rel="noopener">
          <img src="03-gold-flame-soft-background.gif" width="1040" height="1450" alt="ゴールドのファーストビュー（炎あり）を拡大する">
        </a>
      </figure>
      <figure id="gold-solid">
        <figcaption>03　ゴールド・炎なし</figcaption>
        <a href="03-gold-black-solid.png" target="_blank" rel="noopener">
          <img src="03-gold-black-solid.png" width="1040" height="1450" alt="ゴールドのファーストビュー（炎なし）を拡大する">
        </a>
      </figure>
    </section>
  </main>
</body>
</html>
